<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthea Medical Database Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .message.system .message-content {
            max-width: 100%;
            background: #e3f2fd;
            color: #1976d2;
            text-align: center;
            font-size: 14px;
            border-radius: 10px;
        }

        .input-container {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 15px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #userInput {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        #userInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            padding: 15px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #666;
        }

        .controls button {
            padding: 8px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .controls button:hover {
            background: #f0f0f0;
        }

        .example-queries {
            padding: 10px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
        }

        .example-queries p {
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .example-queries button {
            margin: 4px;
            padding: 6px 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .example-queries button:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* Scrollbar styling */
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Query tracking collapsible widget */
        .query-tracker {
            margin-top: 10px;
            border-top: 1px solid #e0e0e0;
            padding-top: 10px;
        }

        .query-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #667eea;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.2s;
            user-select: none;
        }

        .query-toggle:hover {
            background: #f0f0f0;
        }

        .query-toggle-icon {
            transition: transform 0.3s;
            font-size: 12px;
        }

        .query-toggle.expanded .query-toggle-icon {
            transform: rotate(90deg);
        }

        .query-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .query-content.expanded {
            max-height: 800px;
            overflow-y: auto;
        }

        .query-item {
            background: #f8f9fa;
            border-left: 3px solid #667eea;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .query-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 11px;
            color: #666;
        }

        .query-source {
            font-weight: 600;
            color: #667eea;
        }

        .query-timestamp {
            color: #999;
        }

        .query-text {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .query-params {
            margin-top: 8px;
            font-size: 11px;
            color: #666;
        }

        .query-params strong {
            color: #333;
        }

        .query-count-badge {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Synthea Medical Database Assistant</h1>
            <p>Ask questions about patient records, procedures, medications, and more</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message system">
                <div class="message-content">
                    Welcome! I can help you query the Synthea patient database. Try asking about patient procedures, conditions, medications, or encounters.
                </div>
            </div>
        </div>

        <div class="example-queries">
            <p>Example queries:</p>
            <button onclick="fillExample('Search for patients named John')">Search patients</button>
            <button onclick="fillExample('What procedures has patient Ethan766 had?')">Patient procedures</button>
            <button onclick="fillExample('What medications is Ethan766 taking?')">Patient medications</button>
            <button onclick="fillExample('What diagnoses does Ethan766 have?')">Patient diagnoses</button>
            <button onclick="fillExample('Show me all encounters for Ethan766')">Patient encounters</button>
            <button onclick="fillExample('What is the database schema?')">Database schema</button>
            <button onclick="fillExample('How many patients are in the database?')">Patient count</button>
            <button onclick="fillExample('Which procedures were performed most frequently? Show top 10.')">Top procedures</button>
            <button onclick="fillExample('Which patient has undergone the most expensive treatment?')">Most expensive treatment</button>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your question here..."
                    onkeypress="handleKeyPress(event)"
                />
            </div>
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>

        <div class="controls">
            <span id="status">Ready</span>
            <div style="display: flex; gap: 10px; align-items: center;">
                <label for="providerSelect" style="font-size: 13px;">Provider:</label>
                <select id="providerSelect" onchange="switchProvider()" style="padding: 6px 12px; border: 1px solid #e0e0e0; border-radius: 12px; font-size: 13px; cursor: pointer; background: white;">
                    <option value="anthropic">Anthropic</option>
                    <option value="sambanova">SambaNova</option>
                </select>
                <button onclick="resetConversation()">Reset Conversation</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        const sessionId = 'session_' + Date.now();
        let isProcessing = false;

        // Fill example query
        function fillExample(text) {
            document.getElementById('userInput').value = text;
            document.getElementById('userInput').focus();
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isProcessing) {
                sendMessage();
            }
        }

        // Add message to chat
        function addMessage(role, content, queries = null) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(contentDiv);

            // Add query tracker if there are queries (only for assistant messages)
            if (role === 'assistant' && queries && queries.length > 0) {
                const queryTracker = createQueryTracker(queries);
                contentDiv.appendChild(queryTracker);
            }

            chatContainer.appendChild(messageDiv);

            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Create query tracker widget
        function createQueryTracker(queries) {
            const tracker = document.createElement('div');
            tracker.className = 'query-tracker';

            // Create toggle button
            const toggle = document.createElement('div');
            toggle.className = 'query-toggle';
            const queryCount = queries.length;
            toggle.innerHTML = `
                <span class="query-toggle-icon">▶</span>
                <span>View ${queryCount} Cypher ${queryCount === 1 ? 'Query' : 'Queries'}</span>
                <span class="query-count-badge">${queryCount}</span>
            `;

            // Create content area
            const content = document.createElement('div');
            content.className = 'query-content';

            // Add queries
            queries.forEach((query, index) => {
                const queryItem = document.createElement('div');
                queryItem.className = 'query-item';

                const meta = document.createElement('div');
                meta.className = 'query-meta';
                meta.innerHTML = `
                    <span class="query-source">Source: ${query.source}</span>
                    <span class="query-timestamp">${new Date(query.timestamp).toLocaleTimeString()}</span>
                `;

                const queryText = document.createElement('div');
                queryText.className = 'query-text';
                queryText.textContent = query.query;

                queryItem.appendChild(meta);
                queryItem.appendChild(queryText);

                // Add parameters if any
                if (query.params && Object.keys(query.params).length > 0) {
                    const params = document.createElement('div');
                    params.className = 'query-params';
                    params.innerHTML = `<strong>Parameters:</strong> ${JSON.stringify(query.params)}`;
                    queryItem.appendChild(params);
                }

                // Add question if available (for cypher_subgraph)
                if (query.question) {
                    const question = document.createElement('div');
                    question.className = 'query-params';
                    question.innerHTML = `<strong>Question:</strong> ${query.question}`;
                    queryItem.appendChild(question);
                }

                content.appendChild(queryItem);
            });

            // Add toggle functionality
            toggle.addEventListener('click', () => {
                toggle.classList.toggle('expanded');
                content.classList.toggle('expanded');
            });

            tracker.appendChild(toggle);
            tracker.appendChild(content);

            return tracker;
        }

        // Update status
        function updateStatus(status) {
            document.getElementById('status').textContent = status;
        }

        // Send message to API
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();

            if (!message || isProcessing) return;

            // Disable input
            isProcessing = true;
            input.disabled = true;
            sendBtn.disabled = true;
            sendBtn.textContent = 'Thinking...';
            updateStatus('Processing...');

            // Add user message to chat
            addMessage('user', message);
            input.value = '';

            try {
                // Send request to API
                const response = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Add assistant response to chat with queries
                addMessage('assistant', data.response, data.executed_queries);
                updateStatus('Ready');

            } catch (error) {
                console.error('Error:', error);
                addMessage('system', `Error: ${error.message}. Please make sure the backend server is running.`);
                updateStatus('Error');
            } finally {
                // Re-enable input
                isProcessing = false;
                input.disabled = false;
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
                input.focus();
            }
        }

        // Reset conversation
        async function resetConversation() {
            try {
                await fetch(`${API_BASE_URL}/chat/reset?session_id=${sessionId}`, {
                    method: 'POST'
                });

                // Clear chat container
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.innerHTML = `
                    <div class="message system">
                        <div class="message-content">
                            Conversation reset. How can I help you?
                        </div>
                    </div>
                `;
                updateStatus('Ready');
            } catch (error) {
                console.error('Error resetting conversation:', error);
                updateStatus('Error');
            }
        }

        // Switch provider
        async function switchProvider() {
            const provider = document.getElementById('providerSelect').value;
            updateStatus('Switching provider...');

            try {
                const response = await fetch(`${API_BASE_URL}/provider`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ provider: provider })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                updateStatus(`Provider: ${data.provider.toUpperCase()}`);

                // Show a system message about the switch
                const providerName = provider === 'anthropic' ? 'Anthropic' : 'SambaNova';
                addMessage('system', `Switched to ${providerName} provider. Models: ${data.models.main_agent} (Main), ${data.models.router} (Router), ${data.models.cypher_agent} (Cypher)`);
            } catch (error) {
                console.error('Error switching provider:', error);
                updateStatus('Error switching provider');
                addMessage('system', `Failed to switch provider: ${error.message}`);
            }
        }

        // Get current provider from server
        async function getCurrentProvider() {
            try {
                const response = await fetch(`${API_BASE_URL}/provider`);
                const data = await response.json();
                document.getElementById('providerSelect').value = data.provider;
                updateStatus(`Provider: ${data.provider.toUpperCase()}`);
            } catch (error) {
                console.error('Error getting current provider:', error);
            }
        }

        // Check server health on load
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                if (data.status === 'healthy') {
                    updateStatus('Connected');
                }
            } catch (error) {
                updateStatus('Server not connected');
                console.error('Health check failed:', error);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkHealth();
            getCurrentProvider();
            document.getElementById('userInput').focus();
        });
    </script>
</body>
</html>
